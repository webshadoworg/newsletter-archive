<!DOCTYPE html>

<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1c4587; --bg:#e4eef0; --bar:#dbe8f5; --rule:#b9cfe6; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); direction:rtl;
         font-family:'Open Sans','Arial Hebrew',Arial,sans-serif; color:#3d3d3d; }
  .wrap { max-width:660px; margin:0 auto; padding:0 10px 28px; }
  .card { background:#fff; border-radius:0 0 6px 6px; overflow:hidden; }
  .top  { background:var(--ink); color:#fff; padding:20px 30px 18px; text-align:center; }
  .top h1 { margin:0; font-size:24px; font-weight:700; line-height:1.3; }
  .top p  { margin:6px 0 0; font-size:15px; opacity:.85; }
  .pad  { padding:24px 30px 8px; }
  video, audio { width:100%; display:block; border-radius:4px; background:#000; }
  audio { background:transparent; }
  h2 { font-size:15px; color:var(--ink); margin:26px 0 10px; font-weight:700;
       border-bottom:1px solid #e6edf3; padding-bottom:7px; }
  .dl { display:block; background:var(--bar); color:var(--ink); text-decoration:none;
        border:1px solid var(--rule); border-radius:4px; padding:13px 18px; margin:0 0 10px;
        font-size:15px; font-weight:600; }
  .dl span { float:left; font-weight:400; opacity:.72; font-size:13px; }
  .dl:hover { background:#cfe0f1; }
  .note { font-size:13px; line-height:1.7; color:#6a6a6a; margin:22px 0 0; }
  .foot { text-align:center; padding:20px 30px 26px; font-size:13px; color:#6a6a6a; }
  .foot a { color:var(--ink); }
  @media (max-width:680px){ .wrap{padding:0 0 22px;} .card{border-radius:0;}
    .pad{padding:18px 18px 8px;} .top{padding:18px 18px 16px;} .top h1{font-size:20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div class="top">
      <h1>No Shtus &mdash; אברהם פריד</h1>

    </div>

    <div class="pad">
      <video controls preload="metadata" playsinline

      </video>
      <div style="height:26px"></div>
      <a class="dl" href="https://gyenewsletters.netlify.app/media/no-shtus-avraham-fried-720p.mp4" download>
